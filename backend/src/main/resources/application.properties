# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# RTSP Configuration
rtsp.stream.url=${RTSP_STREAM_URL:rtsp://localhost:8554/stream}

# WebSocket Configuration
websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost}

# Security Configuration
security.admin.username=${SECURITY_ADMIN_USERNAME:admin}
security.admin.password=${SECURITY_ADMIN_PASSWORD:$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy}

# Security Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.com.visionflow=INFO
