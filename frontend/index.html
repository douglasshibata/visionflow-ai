<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionFlow AI Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundle/stomp.umd.min.js"
            integrity="sha384-7kCAHRfnMEwiFjBH3VT6+oS7UE/RF6JxH3fDiOTO0Fv/YNMUV3bEbfjDpSii8tA"
            crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">
    <div class="container mx-auto p-4">
        <header class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-blue-500">VisionFlow AI <span class="text-sm font-normal text-gray-400">Indústria 4.0</span></h1>
            <div id="status" class="px-3 py-1 rounded-full bg-red-600 text-sm">Desconectado</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Live Feed Column -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-black rounded-lg overflow-hidden relative border-2 border-gray-800">
                    <div class="absolute top-2 left-2 bg-blue-600 px-2 py-1 text-xs rounded">Câmera Principal - Linha A</div>
                    <canvas id="video-canvas" class="w-full h-auto bg-gray-900"></canvas>
                </div>
            </div>

            <!-- Alerts Column -->
            <div class="bg-gray-800 p-4 rounded-lg">
                <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">Log de Detecção</h2>
                <div id="alerts" class="space-y-3 h-[500px] overflow-y-auto pr-2">
                    <!-- Alerts will be injected here -->
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
